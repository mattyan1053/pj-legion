name: build

# Windows 用の exe を書き出して、成果物として置く。
# clone も Godot も無しで、ダウンロードして遊べるようにするためのもの。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
      TEMPLATE_DIR: /home/runner/.local/share/godot/export_templates/4.7.2.stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Cache Windows export template
        id: cache-template
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATE_DIR }}
          key: godot-template-windows-${{ env.GODOT_VERSION }}

      # 配布されているのは全プラットフォーム入りの大きな 1 ファイルだけなので、
      # Windows のリリース用だけを取り出してキャッシュする。
      - name: Download Windows export template
        if: steps.cache-template.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TEMPLATE_DIR"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz \
            "templates/windows_release_x86_64.exe" "templates/version.txt" -d "$TEMPLATE_DIR"
          rm /tmp/templates.tpz

      - name: Export
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p build
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/pj-legion.exe
          test -s build/pj-legion.exe
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: pj-legion-windows
          path: build/pj-legion.exe
          retention-days: 14
