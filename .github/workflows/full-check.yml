name: full-check

# 長い検査（tools/check.sh --full）。PR ごとの検査（ci の check）から外した、時間の掛かるテストと
# 自動の対戦のほかのステージも回す。PR では回さず、main に入ったあとと、手で起動したときに回す。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Check project (full)
        run: tools/check.sh --full ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
